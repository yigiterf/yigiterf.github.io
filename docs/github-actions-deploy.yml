# ------------------------------------------------------------------
# BU DOSYAYI GITHUB ARAYÜZÜNDEN .github/workflows/deploy.yml OLARAK EKLE
#
# Neden burada duruyor? Yereldeki git token'ında `workflow` yetkisi
# olmadığı için bu dosya doğrudan push edilemiyor. Web arayüzünden
# oluşturmak bu kısıtı aşar (bkz. README → "GitHub Actions akışına
# geçmek istersen").
#
# Ekledikten sonra: repo → Settings → Pages → Source: GitHub Actions
# Bundan sonra her `git push` siteyi otomatik derleyip yayınlar.
# ------------------------------------------------------------------
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
